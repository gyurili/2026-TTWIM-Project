name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  get-pr-info:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      title: ${{ steps.pr.outputs.title }}
    steps:
      - name: Get PR title for this commit
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            | jq -r 'if type == "array" then (.[0].title // empty) else empty end')

          if [ -z "$TITLE" ]; then
            TITLE="${{ github.event.head_commit.message }}"
          fi

          echo "title<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TITLE" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  notify-start:
    needs: get-pr-info
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord - deploy started
        env:
          PR_TITLE: ${{ needs.get-pr-info.outputs.title }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ACTOR: ${{ github.actor }}
        run: |
          PAYLOAD=$(jq -n \
            --arg desc "$PR_TITLE" \
            --arg actor "$ACTOR" \
            '{
              content: "**🚀 azas-backend 배포 중입니다...**\n\n* 작업 내용: \($desc)\n* 작업자: \($actor)"
            }')
          curl --fail -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"

  build-and-push:
    needs: [get-pr-info, notify-start]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/azas-backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/azas-backend
            git pull origin main

            echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            docker-compose down
            docker rm -f azas-backend-web-1 2>/dev/null || true
            docker system prune -a -f
            docker-compose pull
            docker-compose up -d

  notify-success:
    needs: [get-pr-info, deploy]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord - deploy completed
        env:
          PR_TITLE: ${{ needs.get-pr-info.outputs.title }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ACTOR: ${{ github.actor }}
        run: |
          PAYLOAD=$(jq -n \
            --arg desc "$PR_TITLE" \
            --arg actor "$ACTOR" \
            '{
              content: "**💙 azas-backend 배포 완료되었습니다!**\n\n* 작업 내용: \($desc)\n* 작업자: \($actor)"
            }')
          curl --fail -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"

  notify-failure:
    needs: [get-pr-info, notify-start, build-and-push, deploy]
    if: ${{ always() && (needs.notify-start.result == 'failure' || needs.build-and-push.result == 'failure' || needs.deploy.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord - deploy failed
        env:
          PR_TITLE: ${{ needs.get-pr-info.outputs.title }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PAYLOAD=$(jq -n \
            --arg desc "$PR_TITLE" \
            --arg actor "$ACTOR" \
            --arg url "$RUN_URL" \
            '{
              content: "**❌ azas-backend 배포 실패했습니다**\n\n* 작업 내용: \($desc)\n* 작업자: \($actor)\n* 로그 확인: \($url)"
            }')
          curl --fail -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
